# Production: HTTP → HTTPS + TLS (Let's Encrypt)
server {
    listen 80;
    server_name ana-dental.ir www.ana-dental.ir _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ana-dental.ir www.ana-dental.ir;

    ssl_certificate     /etc/letsencrypt/live/ana-dental.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ana-dental.ir/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /var/www/html;
    index index.html index.php;
    client_max_body_size 12m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/rss+xml
        image/svg+xml
        font/woff2;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location ^~ /backend/admin/ {
        client_max_body_size 260m;
        client_body_timeout 3600s;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /backend/admin/index.php?$query_string;
        location ~ \.php$ {
            client_max_body_size 260m;
            client_body_timeout 3600s;
            fastcgi_read_timeout 600s;
            fastcgi_send_timeout 600s;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param HTTPS on;
            fastcgi_pass php:9000;
        }
    }

    location ^~ /backend/api/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param HTTPS on;
            fastcgi_pass php:9000;
        }
    }

    location ^~ /backend/install.php {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_pass php:9000;
    }

    location = /blog { return 301 /blog.php; }
    location = /blog.html { return 301 /blog.php$is_args$args; }
    location = /blog-post.html {
        return 301 /post/$arg_slug;
    }
    location = /contact { return 301 /contact.php; }
    location = /sitemap.xml { rewrite ^ /sitemap.php last; }
    location ~ ^/post/([^/]+)/?$ {
        rewrite ^/post/([^/]+)/?$ /post.php?slug=$1 last;
    }

    location ~* \.(?:css|js|mjs|woff2?|ttf|otf|eot|ico|svg|webp|avif|png|jpe?g|gif|mp4|webm)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /404.php;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_pass php:9000;
    }

    location ~* /(config\.php|installed\.lock|.*\.sql)$ {
        deny all;
    }

    location ~ /\. {
        deny all;
    }
}
