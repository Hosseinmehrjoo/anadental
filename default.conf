server {
    listen 80;
    server_name _;
    root /var/www/html;
    index index.html index.php;

    client_max_body_size 12m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/rss+xml
        image/svg+xml
        font/woff2;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Real IP behind CDN / reverse proxy (fill TRUSTED ranges via include if needed)
    # set_real_ip_from 10.0.0.0/8;
    # real_ip_header X-Forwarded-For;
    # real_ip_recursive on;

    # Security headers for public pages
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Do not cache admin / API / forms
    location ^~ /backend/admin/ {
        client_max_body_size 260m;
        client_body_timeout 3600s;
        client_header_timeout 3600s;
        send_timeout 3600s;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /backend/admin/index.php?$query_string;
        location ~ \.php$ {
            client_max_body_size 260m;
            client_body_timeout 3600s;
            fastcgi_read_timeout 600s;
            fastcgi_send_timeout 600s;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_pass php:9000;
        }
    }

    location ^~ /backend/api/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_pass php:9000;
        }
    }

    location ^~ /backend/install.php {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass php:9000;
    }

    # Pretty blog URLs
    location = /blog {
        return 301 /blog.php;
    }
    location = /contact {
        return 301 /contact.php;
    }
    location ~ ^/post/([^/]+)/?$ {
        rewrite ^/post/([^/]+)/?$ /post.php?slug=$1 last;
    }

    # Cache public static assets aggressively (safe for hashed/versioned media)
    location ~* \.(?:css|js|mjs|woff2?|ttf|otf|eot|ico|svg|webp|avif|png|jpe?g|gif|mp4|webm)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /404.php;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass php:9000;
    }

    location ~* /(config\.php|installed\.lock|.*\.sql)$ {
        deny all;
    }

    location ~ /\. {
        deny all;
    }
}
